<sly data-sly-use.model="com.aem.ecm.core.models.CARegionalOfficesModel"
     data-sly-use.templates="core/wcm/components/commons/v1/templates.html"/>

<section class="cmp-regional-offices"
         data-sly-test="${!model.empty}">

    <h2 class="cmp-regional-offices__title">
        Our Regional Offices
    </h2>

    <div class="cmp-regional-offices__grid">

            <div class="cmp-regional-offices__country">
                ${model.countryCode}
            </div>

            <h3 class="cmp-regional-offices__office-name">
                ${model.officeName}
            </h3>

            <dl class="cmp-regional-offices__details">

                <div class="cmp-regional-offices__detail">
                    <dt>Email</dt>

                    <dd>
                        <a href="mailto:${model.supportEmail}">
                            ${model.supportEmail}
                        </a>
                    </dd>
                </div>

                <div class="cmp-regional-offices__detail">
                    <dt>Phone</dt>

                    <dd>
                        <a href="tel:${model.supportPhone}">
                            ${model.supportPhone}
                        </a>
                    </dd>
                </div>

            </dl>

    </div>
</section>

<sly data-sly-call="${templates.placeholder
    @ isEmpty=model.empty,
      classAppend='cmp-regional-offices'}">
</sly>
